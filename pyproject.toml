[project]
name = "wish-recovery"
version = "0.1.0"
description = "What Does a Wish Leave Out? Requirement recovery in wish-driven code agents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Yanhao Bai" },
  { name = "Kaitlyn Bassford" },
  { name = "Wen Tao Koh" },
]
dependencies = [
  "huggingface_hub>=0.26",
  "numpy>=1.26",
  "openai>=1.60",
  "pyarrow>=16",
  "pytest>=8",
  "pyyaml>=6",
  "scikit-learn>=1.5",
  "scipy>=1.14",
  "sentence-transformers>=5.0",
  "torch>=2.4",
  "transformers>=4.51",
]

[dependency-groups]
# Developer tooling only; `uv sync` installs this group by default.
dev = [
  "mypy>=2.4",
  "pytest-cov>=7",
  "ruff>=0.17",
  "types-pyyaml>=6",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
package = false

[tool.coverage.run]
source = ["src/wishrec"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]

# ---------------------------------------------------------------------------------------------
# Ruff: linter and formatter.  The code base is written to ~100 columns.
# ---------------------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Committed research artifacts are hash-checked by the tests; never touch them.
extend-exclude = ["data", "results", "paper", "notebooks"]
force-exclude = true

[tool.ruff.lint]
select = [
  "A",    # flake8-builtins
  "ANN",  # flake8-annotations
  "ARG",  # flake8-unused-arguments
  "B",    # flake8-bugbear
  "BLE",  # flake8-blind-except
  "C4",   # flake8-comprehensions
  "D",    # pydocstyle
  "DTZ",  # flake8-datetimez
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "FURB", # refurb
  "G",    # flake8-logging-format
  "I",    # isort
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # flake8-logging
  "N",    # pep8-naming
  "PERF", # perflint
  "PGH",  # pygrep-hooks
  "PIE",  # flake8-pie
  "PLE",  # pylint errors
  "PLW",  # pylint warnings
  "PT",   # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "RET",  # flake8-return
  "RUF",  # ruff-specific
  "S",    # flake8-bandit
  "SIM",  # flake8-simplify
  "T10",  # flake8-debugger
  "UP",   # pyupgrade
  "W",    # pycodestyle warnings
]
ignore = [
  "D105",    # magic methods are self-describing
  "D107",    # __init__ is documented on the class
  "ISC001",  # conflicts with the formatter
  "N803",    # `X`/`y` follow the scikit-learn naming convention
  "N806",    # same, for local variables
  "PTH123",  # builtin open() is clear enough
  "S311",    # `random` drives seeded sampling, not cryptography
  "S603",    # subprocess runs generated code by design, inside a sandboxed workspace
  "S607",    # same; partial executable paths are resolved from the venv
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "ANN",     # pytest functions and fixtures are not part of the typed API
  "ARG",     # fakes accept and ignore real signatures
  "D",       # test names are the documentation
  "S101",    # pytest uses assert
  "S108",    # tests use fixed temporary paths
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
known-first-party = ["wishrec"]

# ---------------------------------------------------------------------------------------------
# mypy: static type checking for the package and scripts.
# ---------------------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src", "scripts"]
mypy_path = "src"
explicit_package_bases = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
pretty = true

# Untyped third-party libraries.
[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "pyarrow.*", "sentence_transformers.*", "datasets.*"]
ignore_missing_imports = true

# torch and transformers are imported lazily in two places; analysing their sources makes
# mypy take minutes, so treat them as opaque.
[[tool.mypy.overrides]]
module = ["torch", "torch.*", "transformers", "transformers.*"]
follow_imports = "skip"
follow_untyped_imports = false
