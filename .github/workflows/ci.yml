# Continuous integration: lint, type-check and test the Python package.
#
# Jobs run in parallel and report independently.  UV_LOCKED makes every uv command fail if
# uv.lock is out of date with pyproject.toml, so CI checks exactly the locked versions.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run catches breakage from the hosted runner image or upstream yanks.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_LOCKED: "1"
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  pre-commit:
    name: Repo hygiene (pre-commit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: .pre-commit-config.yaml
      - name: Run hygiene, spelling and workflow linters
        # Ruff and mypy have dedicated jobs below.
        env:
          SKIP: ruff-check,ruff-format,mypy
        run: uvx pre-commit run --all-files --show-diff-on-failure

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      # Ruff needs only the dev group, not torch.
      - name: Ruff check
        run: uv run --only-dev ruff check --output-format=github .
      - name: Ruff format
        run: uv run --only-dev ruff format --check --diff .

  typecheck:
    name: Type-check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install locked environment
        run: uv sync
      - name: mypy
        run: uv run mypy

  test:
    name: Test (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install locked environment
        run: uv sync
      - name: pytest with coverage
        run: uv run pytest --cov --cov-report=xml --cov-report=term
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('.coverage') != '' }}
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14
