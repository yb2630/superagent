name: Feature or experiment request
description: Propose a new feature, condition, analysis or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Motivation
      description: What question or problem does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? Note any effect on committed results or the paper.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
